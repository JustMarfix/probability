name: Compile and release PDF on push
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set variables
        id: vars
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Get Typst
        uses: robinraju/release-downloader@v1.13
        with:
          repository: typst/typst
          latest: true
          filename: typst-x86_64-unknown-linux-musl.tar.xz
      - name: Unpack the executable
        run: |
          tar -xf typst-x86_64-unknown-linux-musl.tar.xz
          mv typst-x86_64-unknown-linux-musl/typst .
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Compile the PDFs
        run: |
          chmod +x typst
          export PATH=$PATH:$(pwd)
          python compile_all.py "v${{ env.date }}-${{ env.sha }}"
      - name: Assemble the GitHub Pages site
        run: |
          python build_site.py \
            --version "v${{ env.date }}-${{ env.sha }}" \
            --commit "${{ github.sha }}" \
            --date "${{ env.date }}" \
            --repo "${{ github.repository }}"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Add tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.date }}-${{ env.sha }}
      - name: Post the release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.pdf"
          name: Edition v${{ env.date }}-${{ env.sha }}
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
